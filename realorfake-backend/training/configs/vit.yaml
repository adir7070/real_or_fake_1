arch: vit_b_16
input_size: 224
batch_size: 64
num_workers: 4

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: cosine
  warmup_epochs: 1

epochs: 20
early_stopping:
  patience: 4
  min_delta: 1.0e-4

loss: cross_entropy

freeze_backbone: true
mixed_precision: true

logging:
  log_dir: runs/vit_b_16
  log_every_n_steps: 50
  save_top_k: 2

augmentations:
  jpeg_compression:
    enabled: true
    probabilities: [0.0, 0.4, 0.6]
    qualities: [95, 70, 40]
