arch: baseline_cnn
input_size: 224
batch_size: 32
num_workers: 4

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler:
  name: cosine
  warmup_epochs: 1

epochs: 30
early_stopping:
  patience: 5
  min_delta: 1.0e-4

loss: cross_entropy

freeze_backbone: false
mixed_precision: false

logging:
  log_dir: runs/baseline_cnn
  log_every_n_steps: 50
  save_top_k: 2

augmentations:
  jpeg_compression:
    enabled: true
    probabilities: [0.0, 0.4, 0.6]
    qualities: [95, 70, 40]
